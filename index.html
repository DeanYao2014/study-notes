<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>初中学习笔记</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0/dist/katex.min.css">
  <style>
    /* =============================================
       DESIGN TOKENS
       ============================================= */
    :root {
      --green:       #2d7d46;
      --green-hover: #236936;
      --green-soft:  #4dac6a;
      --green-bg:    #edf5ef;

      --bg:          #fdfbf7;
      --surface:     #f5f3ee;
      --surface-hover: #ece9e2;
      --card:        #ffffff;

      --border:      #e6e3dc;
      --border-light:#efede8;

      --text:        #3d3a35;
      --text-2:      #787570;
      --text-3:      #9e9b95;
      --text-hd:     #2a2722;

      --shadow-xs: 0 1px 2px rgba(0,0,0,0.03);
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.03);
      --shadow-md: 0 4px 14px rgba(0,0,0,0.05), 0 1px 3px rgba(0,0,0,0.03);

      --radius-sm: 6px;
      --radius:    10px;
      --radius-lg: 14px;

      --sidebar-w: 260px;
      --toc-w:     40px;
      --toc-expand: 240px;
    }

    .dark {
      --green:       #4dac6a;
      --green-hover: #5cbb79;
      --green-soft:  #4dac6a;
      --green-bg:    #1a3322;

      --bg:          #1e1f22;
      --surface:     #27282b;
      --surface-hover: #303134;
      --card:        #2e2f33;

      --border:      #3d3e42;
      --border-light:#343538;

      --text:        #d4d3cf;
      --text-2:      #969590;
      --text-3:      #7a7975;
      --text-hd:     #e8e8e6;

      --shadow-xs: 0 1px 2px rgba(0,0,0,0.10);
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.14), 0 1px 2px rgba(0,0,0,0.10);
      --shadow-md: 0 4px 14px rgba(0,0,0,0.22), 0 1px 3px rgba(0,0,0,0.12);
    }

    /* =============================================
       RESET & BASE
       ============================================= */
    *, *::before, *::after { box-sizing: border-box; }
    html {
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    body {
      font-family: -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      line-height: 1.7;
      min-height: 100vh;
    }

    /* =============================================
       SIDEBAR — 左侧导航 (Docsify 生成在 #app 内)
       ============================================= */
    .sidebar {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: var(--sidebar-w);
      background: var(--surface);
      border-right: 1px solid var(--border);
      z-index: 50;
      overflow-y: auto;
      transform: translateX(0);
      transition: transform 0.3s ease;
      box-shadow: none;
    }
    body.close .sidebar {
      transform: translateX(calc(-1 * var(--sidebar-w)));
    }

    /* 搜索框 */
    .search {
      margin: 0;
      padding: 15px 18px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .search input {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 9px 14px;
      font-size: 13.5px;
      width: 100%;
      outline: none;
      color: var(--text);
      box-shadow: var(--shadow-xs);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(45,125,70,0.08);
    }
    .results-panel {
      background: var(--card);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
    }

    /* 导航列表 */
    .sidebar-nav { padding: 6px 0; }
    .sidebar-nav li { margin: 0; list-style: none; }

    .sidebar-nav > li > a,
    .sidebar-nav > li > p {
      font-weight: 650;
      font-size: 13px;
      letter-spacing: 0.03em;
      color: var(--text-hd);
      padding: 9px 10px 5px 2px;
      border-left: 3px solid transparent;
      display: block;
      text-decoration: none;
    }
    .sidebar-nav > li {
      border-bottom: 1px solid var(--border-light);
      padding-bottom: 4px;
      margin-bottom: 2px;
    }

    .sidebar-nav a {
      color: var(--text);
      padding: 4px 10px 4px 2px;
      font-size: 13px;
      display: block;
      text-decoration: none;
      border-left: 3px solid transparent;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      border-radius: 0 5px 5px 0;
      margin-right: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sidebar-nav a:hover {
      background: var(--surface-hover);
      color: var(--text-hd);
      border-left-color: var(--border);
    }
    .sidebar-nav .active > a {
      color: var(--green);
      font-weight: 620;
      border-left: 3px solid var(--green);
      background: var(--green-bg);
    }

    .sidebar-nav ul a {
      padding-left: 10px;
      font-size: 12.5px;
      color: var(--text);
    }
    .sidebar-nav ul ul a {
      padding-left: 18px;
      font-size: 12px;
      color: var(--text-2);
    }

    .dark .sidebar-nav a { color: #c8c6c1; }
    .dark .sidebar-nav > li > a,
    .dark .sidebar-nav > li > p { color: #e0ded9; }
    .dark .sidebar-nav ul ul a { color: #9e9b95; }
    .dark .sidebar-nav .active > a { color: var(--green-soft); }

    /* =============================================
       HAMBURGER — 侧栏切换按钮
       ============================================= */
    #sidebarToggle {
      position: fixed;
      top: 16px;
      left: calc(var(--sidebar-w) + 14px);
      z-index: 65;
      width: 34px;
      height: 34px;
      padding: 0;
      border-radius: 50%;
      background: var(--card);
      border: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-sm);
      transition: left 0.3s ease, transform 0.2s, box-shadow 0.2s, border-color 0.2s, background 0.2s;
    }
    #sidebarToggle:hover {
      border-color: var(--green);
      background: var(--green-bg);
      box-shadow: var(--shadow-md);
      transform: scale(1.08);
    }
    body.close #sidebarToggle {
      left: 18px;
    }
    #sidebarToggle .hb-line {
      display: block;
      width: 16px;
      height: 1.5px;
      background: var(--text);
      border-radius: 1px;
      transition: background 0.2s;
    }
    #sidebarToggle .hb-stack {
      display: flex;
      flex-direction: column;
      gap: 3.5px;
      align-items: center;
    }

    /* =============================================
       CONTENT — 主内容区
       ============================================= */
    .content {
      margin-left: var(--sidebar-w);
      margin-right: var(--toc-w);
      transition: margin-left 0.3s ease, margin-right 0.3s ease;
      min-height: 100vh;
    }
    body.close .content {
      margin-left: 0;
    }

    .markdown-section {
      background: transparent;
      color: var(--text);
      max-width: 780px;
      padding: 40px 0 100px 52px;
    }

    /* =============================================
       CONTENT TYPOGRAPHY
       ============================================= */
    .markdown-section h1 {
      font-size: 1.6em;
      font-weight: 700;
      color: var(--text-hd);
      border-bottom: 2px solid var(--green);
      padding-bottom: 11px;
      margin: 0 0 26px;
      letter-spacing: 0.01em;
    }
    .markdown-section h2 {
      font-size: 1.22em;
      font-weight: 650;
      color: var(--text-hd);
      margin: 38px 0 14px;
      padding-top: 6px;
    }
    .markdown-section h3 {
      font-size: 1.06em;
      font-weight: 620;
      color: var(--text-hd);
      margin: 24px 0 10px;
    }

    .markdown-section a {
      color: var(--green);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s;
    }
    .markdown-section a:hover { border-bottom-color: var(--green); }

    .markdown-section table {
      border-collapse: collapse;
      width: 100%;
      font-size: 13.5px;
      margin: 16px 0;
      border-radius: var(--radius-sm);
      overflow: hidden;
      box-shadow: var(--shadow-xs);
      border: 1px solid var(--border-light);
    }
    .markdown-section th {
      background: var(--green);
      color: #fff;
      padding: 9px 15px;
      text-align: left;
      font-weight: 600;
      font-size: 12.5px;
      letter-spacing: 0.03em;
    }
    .markdown-section td {
      padding: 8px 15px;
      border-bottom: 1px solid var(--border-light);
      background: var(--card);
    }
    .markdown-section tr:last-child td { border-bottom: none; }
    .markdown-section tr:nth-child(even) td { background: var(--surface); }

    .markdown-section code {
      background: var(--surface);
      padding: 2px 7px;
      border-radius: var(--radius-sm);
      font-size: 0.88em;
      color: var(--text-hd);
      border: 1px solid var(--border-light);
      font-family: Consolas, Menlo, monospace;
    }
    .markdown-section pre {
      background: var(--surface) !important;
      padding: 17px 22px;
      border-radius: var(--radius);
      overflow-x: auto;
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-xs);
      font-family: Consolas, Menlo, monospace;
      font-size: 13px;
    }

    .markdown-section blockquote {
      border-left: 3px solid var(--green);
      background: var(--surface);
      margin: 16px 0;
      padding: 13px 20px;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      color: var(--text-2);
      font-size: 0.94em;
    }

    .markdown-section details {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      margin: 14px 0;
      box-shadow: var(--shadow-xs);
    }
    .markdown-section summary {
      font-weight: 600;
      cursor: pointer;
      color: var(--green);
      padding: 4px 0;
    }

    /* KaTeX */
    .katex, .katex * { box-sizing: content-box !important; }
    .dark .katex { color: #d8d6cd; }
    .dark .katex .mord math { color: #d8d6cd; }

    /* Mermaid */
    .mermaid {
      background: var(--surface);
      padding: 22px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      margin: 16px 0;
      overflow-x: auto;
      box-shadow: var(--shadow-xs);
    }
    .mermaid svg { max-width: 100%; }

    /* =============================================
       RIGHT TOC — 右侧页面大纲
       ============================================= */
    #page-toc {
      position: fixed;
      right: 0;
      top: 0;
      bottom: 0;
      z-index: 45;
      display: flex;
      flex-direction: row-reverse;
      width: var(--toc-w);
      background: var(--surface);
      border-left: 1px solid var(--border);
      box-shadow: var(--shadow-xs);
      overflow: hidden;
      transition: width 0.3s ease;
    }
    #page-toc.expanded {
      width: var(--toc-expand);
    }

    #tocHandle {
      width: var(--toc-w);
      flex-shrink: 0;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 20px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      color: var(--text-2);
      transition: color 0.2s;
      font-size: 15px;
      background: none;
      border: none;
      outline: none;
      font-family: inherit;
    }
    #tocHandle:hover { color: var(--green); }

    #tocBody {
      display: none;
      flex: 1;
      flex-direction: column;
      overflow: hidden;
      padding: 18px 14px 18px 4px;
    }
    #tocBody.open { display: flex; }

    #tocBody > .toc-title {
      font-size: 12px;
      font-weight: 650;
      letter-spacing: 0.04em;
      color: var(--text-hd);
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    #tocNav {
      overflow-y: auto;
      flex: 1;
    }

    /* =============================================
       THEME BUTTON — 日夜切换
       ============================================= */
    #themeBtn {
      position: fixed;
      z-index: 100;
      bottom: 26px;
      left: 26px;
      width: 42px;
      height: 42px;
      padding: 0;
      border-radius: 50%;
      font-size: 1.15em;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s, background 0.25s;
      user-select: none;
      -webkit-user-select: none;
    }
    #themeBtn:hover {
      transform: scale(1.12);
      box-shadow: var(--shadow-md);
      border-color: var(--green);
    }

    /* =============================================
       MOBILE MASK
       ============================================= */
    #mobileMask {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(0,0,0,0.35);
    }

    /* =============================================
       SCROLLBAR
       ============================================= */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #aaa; }
    .dark ::-webkit-scrollbar-thumb { background: #555; }
    .dark ::-webkit-scrollbar-thumb:hover { background: #777; }

    /* =============================================
       RESPONSIVE — 平板 (768–1023px)
       ============================================= */
    @media (max-width: 1023px) {
      :root {
        --sidebar-w: 240px;
      }
      .content {
        margin-right: var(--toc-w);
      }
      #sidebarToggle {
        left: calc(var(--sidebar-w) + 10px);
      }
      body.close #sidebarToggle {
        left: 14px;
      }
      .markdown-section {
        padding: 28px 28px 70px;
        max-width: 100%;
      }
    }

    /* =============================================
       RESPONSIVE — 手机 (<768px)
       ============================================= */
    @media (max-width: 767px) {
      :root {
        --sidebar-w: 280px;
      }

      /* Sidebar: 覆盖模式 */
      .sidebar {
        transform: translateX(-100%);
        box-shadow: var(--shadow-md);
        z-index: 55;
      }
      body:not(.close) .sidebar {
        transform: translateX(0);
      }

      /* 内容：全宽 */
      .content {
        margin-left: 0 !important;
        margin-right: var(--toc-w) !important;
      }

      /* Hamburger：右上角，避开 TOC */
      #sidebarToggle {
        top: 14px;
        left: auto !important;
        right: calc(var(--toc-w) + 8px);
        width: 36px;
        height: 36px;
      }
      body:not(.close) #sidebarToggle {
        right: calc(var(--toc-w) + 8px);
      }

      .markdown-section {
        padding: 20px 16px 80px;
        max-width: 100%;
      }

      #themeBtn {
        bottom: 20px;
        left: 20px;
        width: 38px;
        height: 38px;
      }

      .mermaid { padding: 12px; }

      /* TOC 保持可见 */
      #page-toc {
        width: var(--toc-w);
      }
    }
  </style>
</head>
<body id="doc-body">

  <!-- 汉堡按钮 -->
  <button id="sidebarToggle" aria-label="切换导航栏">
    <span class="hb-stack">
      <span class="hb-line"></span>
      <span class="hb-line"></span>
      <span class="hb-line"></span>
    </span>
  </button>

  <!-- Docsify 挂载点 -->
  <div id="app">加载中...</div>

  <!-- 主题切换 -->
  <button id="themeBtn">🌙</button>

  <!-- 右侧页面大纲 -->
  <div id="page-toc">
    <button id="tocHandle">◀</button>
    <div id="tocBody">
      <div class="toc-title">📑 本页目录</div>
      <div id="tocNav"></div>
    </div>
  </div>

  <!-- 移动端遮罩 -->
  <div id="mobileMask"></div>

  <!-- JS 库 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraphcore.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

  <script>
    // =============================================
    //  Mermaid
    // =============================================
    mermaid.initialize({ startOnLoad: false, theme: 'neutral' });

    // =============================================
    //  Docsify 配置
    // =============================================
    window.$docsify = {
      name: '📚 初中学习笔记',
      loadSidebar: '_sidebar.md',
      subMaxLevel: 0,
      auto2top: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '🔍 搜索知识点...',
        noData: '😕 没有找到相关内容',
        depth: 4
      },
      markdown: { smartypants: true },
      plugins: [function (hook) {
        hook.beforeEach(function (c) {
          c = c.replace(/```mermaid\s*\n([\s\S]*?)```/g, function (_, code) {
            return '<div class="mermaid">' + code.trim() + '</div>';
          });
          c = c.replace(/\\\[([\s\S]*?)\\\]/g, function (_, t) {
            return '\n$$\n' + t.trim().replace(/\\\\/g, '\\\\\\\\') + '\n$$\n';
          });
          c = c.replace(/\\\((.+?)\\\)/g, function (_, t) { return '$' + t.trim() + '$'; });
          return c;
        });
        hook.doneEach(function () {
          var el = document.querySelector('.markdown-section');
          if (el && window.renderMathInElement) {
            renderMathInElement(el, {
              delimiters: [
                { left: '$$', right: '$$', display: true },
                { left: '$',  right: '$',  display: false },
              ],
              throwOnError: false,
            });
          }
          if (el && window.mermaid) {
            try { mermaid.run({ querySelector: '.mermaid' }); } catch (e) {}
          }
          buildPageToc();
        });
      }],
    };

    // =============================================
    //  右侧页面大纲生成
    // =============================================
    function buildPageToc() {
      var nav = document.getElementById('tocNav');
      if (!nav) return;
      var el = document.querySelector('.markdown-section');
      if (!el) { nav.innerHTML = ''; return; }
      var hs = el.querySelectorAll('h2, h3');
      if (!hs.length) {
        nav.innerHTML = '<span style="font-size:11px;color:var(--text-3)">无标题</span>';
        return;
      }
      nav.innerHTML = '';
      var activeLink = null;
      hs.forEach(function (h, i) {
        if (!h.id) h.id = 'hdr-' + i;
        var a = document.createElement('a');
        a.href = '#' + h.id;
        a.textContent = h.textContent;
        var isH2 = h.tagName === 'H2';
        a.style.cssText =
          'display:block;padding:4px 0 4px ' + (isH2 ? '10px' : '24px') + ';' +
          'font-size:' + (isH2 ? '12.5px' : '11.5px') + ';' +
          'font-weight:' + (isH2 ? '620' : '400') + ';' +
          'border-left:2px solid transparent;' +
          'text-decoration:none;color:var(--text-2);' +
          'transition:color 0.15s,border-color 0.15s;';
        a.onmouseenter = function () {
          if (this !== activeLink) { this.style.color = 'var(--green)'; this.style.borderColor = 'var(--green)'; }
        };
        a.onmouseleave = function () {
          if (this !== activeLink) { this.style.color = 'var(--text-2)'; this.style.borderColor = 'transparent'; }
        };
        a.onclick = function (e) {
          e.preventDefault();
          h.scrollIntoView({ behavior: 'smooth' });
          if (activeLink) { activeLink.style.color = 'var(--text-2)'; activeLink.style.borderColor = 'transparent'; }
          activeLink = a;
          a.style.color = 'var(--green)';
          a.style.borderColor = 'var(--green)';
        };
        nav.appendChild(a);
      });
    }

    // =============================================
    //  右侧大纲折叠/展开
    // =============================================
    (function () {
      var toc   = document.getElementById('page-toc');
      var handle = document.getElementById('tocHandle');
      var bodyEl = document.getElementById('tocBody');
      if (!toc || !handle) return;
      handle.addEventListener('click', function () {
        var open = !toc.classList.contains('expanded');
        toc.classList.toggle('expanded');
        handle.textContent = open ? '▶' : '◀';
        if (bodyEl) { bodyEl.classList.toggle('open'); }
      });
    })();

    // =============================================
    //  夜间模式
    // =============================================
    (function () {
      var btn = document.getElementById('themeBtn');
      var stored = localStorage.getItem('theme');
      if (stored === 'dark') {
        document.getElementById('doc-body').classList.add('dark');
        btn.textContent = '☀️';
      }
      btn.addEventListener('click', function () {
        var isDark = document.getElementById('doc-body').classList.toggle('dark');
        btn.textContent = isDark ? '☀️' : '🌙';
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
      });
    })();

    // =============================================
    //  汉堡按钮：切换侧栏
    // =============================================
    (function () {
      var btn = document.getElementById('sidebarToggle');
      btn.addEventListener('click', function () {
        document.body.classList.toggle('close');
      });
    })();

    // =============================================
    //  移动端：遮罩 + 自动关闭
    // =============================================
    (function () {
      var mask = document.getElementById('mobileMask');
      var isMobile = function () { return window.innerWidth <= 767; };

      // 初始化：手机默认关闭侧栏
      if (isMobile()) {
        document.body.classList.add('close');
      }

      var updateMask = function () {
        if (!isMobile()) {
          mask.style.display = 'none';
          return;
        }
        mask.style.display = document.body.classList.contains('close') ? 'none' : 'block';
      };

      // 监听 body class 变化
      var observer = new MutationObserver(updateMask);
      observer.observe(document.body, { attributes: true, attributeFilter: ['class'] });

      // 窗口大小变化
      window.addEventListener('resize', updateMask);

      // 点击遮罩 → 关闭侧栏
      mask.addEventListener('click', function () {
        document.body.classList.add('close');
      });

      // 初始状态
      updateMask();
    })();

    // =============================================
    //  JSXGraph
    // =============================================
    window.addEventListener('load', function () {
      setTimeout(function () {
        document.querySelectorAll('script.jxg-code').forEach(function (el) {
          try { eval(el.textContent); } catch (e) {}
        });
      }, 600);
    });
  </script>
</body>
